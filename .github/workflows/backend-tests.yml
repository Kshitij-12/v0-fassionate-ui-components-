name: backend-tests

on:
  push:
    branches:
      - feature/taste-match
  pull_request:
    branches:
      - feature/taste-match

jobs:
  lint-and-typecheck:
    name: Lint and Typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install
        run: pnpm install
        env:
          CI: true

      - name: Run linter
        run: pnpm lint
        continue-on-error: false

      - name: Typecheck
        run: pnpm run build --if-present
        continue-on-error: false

  tests-and-build:
    name: Tests and Build
    runs-on: ubuntu-latest
    needs: lint-and-typecheck
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install
        run: pnpm install
        env:
          CI: true

      - name: Run tests
        run: pnpm test
        continue-on-error: false

      - name: Build
        run: pnpm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
